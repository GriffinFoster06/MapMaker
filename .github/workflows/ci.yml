name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests, build, provenance (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run provenance:check

  # Q7 A/B gate (Phase 4b): the structured pipeline's previews (50k, 200k) against a 1M final, three seeds, compared
  # with tools/tuning/ab-baseline.structured.json. Fails on regression only. The 2.56M final runs nightly.
  ab-gate:
    name: Q7 A/B gate (structured)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: A/B run (seeds 1, 777, 12345; previews 50k, 200k; final 1M)
        env:
          NODE_OPTIONS: --max-old-space-size=12000
        run: npx tsx tools/tuning/ab/run.mjs --pipeline structured --seeds 1,777,12345 --previews 50000,200000 --finals 1000000 --out ab-current.json
      - name: Gate
        run: npx tsx tools/tuning/ab/gate.mjs --current tools/tuning/ab-current.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-gate
          path: |
            tools/tuning/ab-current.json
            tools/tuning/results/ab/
          retention-days: 30

  # Q3: bit-exactness is a CI-tested goal (scope: decision W7). The probe runs in Node on Ubuntu, macOS and Windows/x64
  # and in Chromium and Firefox on Ubuntu and macOS, and is compared with tools/determinism/golden.json. The Windows
  # runner has no GPU, so it runs Node checks only (lint, typecheck, unit tests, the Node probe); no Playwright.
  # Strict keys must match everywhere: RNG, topology, history, and every `fd.` key (the
  # whole probe re-run with dmath.mode = 'fdlibm', including Float64 points, areas, circumcentres, the dmath sweep and
  # a 1M-cell mesh). Native-mode libm-dependent keys are reported only.
  determinism:
    name: determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: runner.os == 'Windows'
        run: |
          npm run lint
          npm run typecheck
      - name: Unit tests (include the mesh and RNG golden hashes)
        run: npm test
      - name: Node probe
        shell: bash
        run: npm run probe 2>&1 | tee probe-node-${{ matrix.os }}.txt
      - name: Install browsers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then npx playwright install --with-deps chromium firefox; else npx playwright install chromium firefox; fi
      - name: Browser probes, flat-map and globe e2e (Chromium, Firefox)
        if: runner.os != 'Windows'
        shell: bash
        # Headless Firefox on Linux has no WebGL, so on Linux Firefox runs headed on a virtual display (playwright.config.ts).
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then FIREFOX_HEADED=1 xvfb-run -a npx playwright test; else npx playwright test; fi
      - name: Divergence report
        if: always()
        shell: bash
        run: |
          echo "## Determinism: ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat probe-node-${{ matrix.os }}.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: determinism-${{ matrix.os }}
          path: |
            probe-node-${{ matrix.os }}.txt
            test-results/
            playwright-report/
          retention-days: 30
