name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /MapMaker/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # Smoke test the live site: the probe in all three engines, and the COOP/COEP shim under the /MapMaker/ base path.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image (browsers, libraries, xvfb): no apt download; keep the tag equal to @playwright/test.
    container: mcr.microsoft.com/playwright:v1.55.1-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Headless Firefox on Linux has no WebGL, so Firefox runs headed on a virtual display (playwright.config.ts).
      - run: xvfb-run -a npx playwright test
        env:
          FIREFOX_HEADED: '1'
          HOME: /root # Firefox refuses to start in the container when $HOME is not owned by the user
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url || 'https://griffinfoster06.github.io/MapMaker/' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-smoke
          path: test-results/
