name: Cloudflare

# Primary hosting (ARCHITECTURE.md Q18): Cloudflare Pages sends COOP/COEP from apps/web/public/_headers, so the
# site is cross-origin isolated without the service-worker shim. main deploys to production; every pull request
# from this repository gets a preview deployment. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# repository secrets; without them the jobs skip with a warning.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: 4.143.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.secrets.outputs.enabled }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the Cloudflare deploy."; echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.secrets.outputs.enabled == 'true'
        run: npm ci
      - if: steps.secrets.outputs.enabled == 'true'
        run: npm run build
        env:
          VITE_BASE: /
      - name: Create the Pages project on first use
        if: steps.secrets.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes "wrangler@$WRANGLER_VERSION" pages project list | grep -qw mapmaker; then
            npx --yes "wrangler@$WRANGLER_VERSION" pages project create mapmaker --production-branch main
          fi
      - id: deploy
        if: steps.secrets.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy apps/web/dist --project-name=mapmaker --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

  # Smoke test the deployed site in both supported engines (Chromium, Firefox; decision W7: no WebKit, so none is installed). With
  # native headers the page must be isolated without ?coi. The specs run in groups side by side (scripts/e2e-files.sh), each group
  # in its own job, so the slowest spec (GPU shaders in software-GL Firefox) no longer waits behind the others.
  smoke:
    name: smoke (${{ matrix.spec.browser }}, ${{ matrix.spec.group }})
    needs: deploy
    if: needs.deploy.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        spec:
          - { browser: chromium, group: heavy }
          - { browser: chromium, group: core }
          - { browser: firefox, group: gpu }
          - { browser: firefox, group: cartomap }
          - { browser: firefox, group: core }
    steps:
      # A new project's or deployment's TLS certificate can take a few minutes to issue (the first deploy failed every
      # test with a TLS handshake error). Wait until the URL serves 200 over TLS with the COEP header.
      - name: Wait for the deployment
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null -D headers.txt "$URL" && grep -qi '^cross-origin-embedder-policy:' headers.txt; then
              echo "Ready after $i attempt(s): $URL"; exit 0
            fi
            sleep 15
          done
          echo "::error::$URL did not serve 200 with COOP/COEP within 10 minutes"; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-Linux-${{ matrix.spec.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser
        id: install
        continue-on-error: true
        timeout-minutes: 5
        run: npx playwright install --with-deps ${{ matrix.spec.browser }}
      - name: Install browser (second try)
        if: steps.install.outcome == 'failure'
        timeout-minutes: 5
        run: npx playwright install --with-deps ${{ matrix.spec.browser }}
      # Headless Firefox on Linux has no WebGL, so Firefox runs headed on a virtual display (playwright.config.ts).
      - run: xvfb-run -a npx playwright test --project=${{ matrix.spec.browser }} $(scripts/e2e-files.sh ${{ matrix.spec.group }})
        env:
          FIREFOX_HEADED: '1'
          E2E_BASE_URL: ${{ needs.deploy.outputs.url }}
          E2E_EXPECT_ISOLATED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-smoke-${{ matrix.spec.browser }}-${{ matrix.spec.group }}
          path: test-results/
